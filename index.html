<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كتالوج خدمات تصميم الجرافيك | المعاينة والاعتماد</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <div class="app-container">
    <!-- Main Header -->
    <header class="app-header">
      <h1 class="app-title">دليل وكتالوج خدمات تصميم الجرافيك</h1>
      <p class="app-subtitle">أوصاف مخصصة ومتكاملة لـ 50+ خدمة إبداعية جاهزة للمراجعة والنسخ المباشر للمتجر</p>
    </header>

    <!-- Search Input -->
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="ابحث عن أي خدمة، قسم، أو كلمة مفتاحية (مثال: شعار، موشن، هويات)...">
      <span class="search-icon">🔍</span>
    </div>

    <!-- Category Tabs Filter -->
    <div id="tabs-container" class="tabs-container">
      <!-- Generated via JS -->
    </div>

    <!-- Services Grid Container -->
    <main id="services-container" class="services-grid">
      <!-- Generated via JS -->
    </main>
  </div>

  <!-- Data Scripts -->
  <script src="js/data/academic.js"></script>
  <script src="js/data/marketing.js"></script>
  <script src="js/data/identity.js"></script>
  <script src="js/data/index.js"></script>

  <!-- Modules -->
  <script src="js/modules/clipboard.js"></script>
  <script src="js/modules/render.js"></script>
  <script src="js/modules/filter.js"></script>
  
  <!-- App Entry -->
  <script src="js/app.js"></script>
</body>
</html>
